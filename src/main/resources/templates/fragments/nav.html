<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<header class="topbar" th:fragment="nav">

    <a class="brand" th:href="@{/}">
        <span class="brand-mark">SP</span>
        <span>
            SchoolPass
            <small>RWANDA</small>
        </span>
    </a>

    <nav>
        <a th:href="@{/}">Dashboard</a>

        <a th:href="@{/students}">
            Students
        </a>

        <a th:href="@{/scan}">
            Scan
        </a>

        <a th:href="@{/attendance}">
            Attendance
        </a>

        <a th:href="@{/finance}">
            Finance
        </a>

        <!-- Correct Audit route -->
        <a th:href="@{/audit}">
            Audit
        </a>

        <a th:href="@{/admin/settings}">
            Settings
        </a>
    </nav>

    <form th:action="@{/logout}" method="post">
        <input
            type="hidden"
            th:name="${_csrf.parameterName}"
            th:value="${_csrf.token}"
        >

        <button class="link-btn">
            Sign out
        </button>
    </form>

</header>

</body>
</html>
