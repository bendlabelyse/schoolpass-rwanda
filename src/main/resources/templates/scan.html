<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan arrival • SchoolPass</title><link rel="stylesheet" th:href="@{/css/app.css}"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container scan-page"><section class="page-head"><div><div class="eyebrow">ARRIVAL CHECK-IN</div><h1>Scan student card</h1><p>Use the laptop/phone camera or a USB QR scanner. Attendance records arrival only.</p></div></section><div class="scan-grid"><div class="panel"><div id="reader"></div><div class="camera-note" id="cameraNote">Camera is optional. You can use a USB scanner or type the credential below.</div><div class="manual"><label>USB scanner / manual code<input id="code" autofocus placeholder="Scan QR or enter secure code"></label><button class="primary wide" id="scanBtn">Record arrival</button></div></div><div class="panel result-panel" id="result"><div class="result-empty"><div class="result-icon">⌁</div><h2>Ready to scan</h2><p>The student's record will appear here after a valid credential is scanned.</p></div></div></div></main><script th:src="@{/js/scan.js}"></script></body></html>
