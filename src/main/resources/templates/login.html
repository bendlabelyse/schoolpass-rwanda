<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in • SchoolPass Rwanda</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="login-page"><div class="login-shell"><div class="login-brand"><span class="brand-mark large">SP</span><div><h1>SchoolPass Rwanda</h1><p>School administration & arrival management</p></div></div><div class="login-card"><div class="eyebrow">SECURE ADMINISTRATION</div><h2>Welcome back</h2><p class="muted">Sign in to manage students, arrivals and authorized finance information.</p><div class="alert error" th:if="${param.error}">The username or password is incorrect.</div><div class="alert success" th:if="${param.logout}">You have signed out successfully.</div><form th:action="@{/login}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary wide">Sign in</button></form></div><p class="login-foot">Authorized school personnel only.</p></div></body></html>
