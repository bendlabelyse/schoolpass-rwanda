<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings • SchoolPass</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container narrow"><section class="page-head"><div><div class="eyebrow">SCHOOL CONFIGURATION</div><h1>School profile</h1><p>Set the information printed on student cards and used in school records.</p></div></section><div class="alert success" th:if="${param.saved}">School profile saved.</div><form class="panel form-panel" th:action="@{/admin/settings}" th:object="${profile}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="form-grid"><label>School name *<input th:field="*{schoolName}" required></label><label>Principal name *<input th:field="*{principalName}" required></label><label>Academic year *<input th:field="*{academicYear}" required></label><label>Contact phone<input th:field="*{contactPhone}"></label><label>Contact email<input th:field="*{contactEmail}" type="email"></label><label class="full">School address<input th:field="*{address}"></label></div><div class="privacy-note"><b>Production note</b><span>The school remains responsible for its official student data, user access, retention rules and legal/data-protection obligations.</span></div><div class="form-actions"><button class="primary">Save school profile</button></div></form></main></body></html>
