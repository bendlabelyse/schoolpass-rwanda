<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit • SchoolPass</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><section class="page-head"><div><div class="eyebrow">SECURITY HISTORY</div><h1>Audit log</h1><p>Administrative record of important student, attendance and finance operations.</p></div></section><div class="panel table-wrap"><table><thead><tr><th>Date/time</th><th>User</th><th>Action</th><th>Entity</th><th>Details</th></tr></thead><tbody><tr th:each="l:${logs}"><td th:text="${#temporals.format(l.createdAt,'yyyy-MM-dd HH:mm:ss')}">date</td><td th:text="${l.username}">user</td><td><span class="pill blue" th:text="${l.action}">ACTION</span></td><td th:text="${l.entityType+' #'+l.entityId}">entity</td><td th:text="${l.details}">details</td></tr></tbody></table><div th:if="${#lists.isEmpty(logs)}" class="empty big">No audit events yet.</div></div></main></body></html>
