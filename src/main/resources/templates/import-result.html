<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Import result • SchoolPass</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container narrow"><section class="page-head"><div><div class="eyebrow">IMPORT COMPLETE</div><h1>Student import result</h1></div></section><div class="stats"><div class="stat accent"><span>Created</span><strong th:text="${created}">0</strong></div><div class="stat warning"><span>Skipped duplicates</span><strong th:text="${skipped}">0</strong></div><div class="stat danger"><span>Errors</span><strong th:text="${#lists.size(errors)}">0</strong></div></div><div class="panel" th:if="${!#lists.isEmpty(errors)}"><h2>Rows needing attention</h2><ul class="errors"><li th:each="e:${errors}" th:text="${e}"></li></ul></div><div class="form-actions"><a class="secondary" th:href="@{/students/import}">Back to import</a><a class="primary" th:href="@{/students}">View students</a></div></main></body></html>
