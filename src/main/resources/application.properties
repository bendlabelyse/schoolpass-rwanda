spring.application.name=SchoolPass Rwanda
server.port=${PORT:8080}

# Local-first default: H2 file database. For production, set SCHOOLPASS_DB_URL,
# SCHOOLPASS_DB_USERNAME and SCHOOLPASS_DB_PASSWORD to PostgreSQL credentials.
spring.datasource.url=${SCHOOLPASS_DB_URL:jdbc:h2:file:./data/schoolpass;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${SCHOOLPASS_DB_USERNAME:sa}
spring.datasource.password=${SCHOOLPASS_DB_PASSWORD:}
spring.datasource.driver-class-name=${SCHOOLPASS_DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Kigali
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.web.resources.cache.period=3600
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false

# Demo/bootstrap credentials. CHANGE these before production.
schoolpass.admin.username=${SCHOOLPASS_ADMIN_USERNAME}
schoolpass.admin.password=${SCHOOLPASS_ADMIN_PASSWORD}
schoolpass.finance.username=${SCHOOLPASS_FINANCE_USERNAME}
schoolpass.finance.password=${SCHOOLPASS_FINANCE_PASSWORD}

schoolpass.school.name=${SCHOOLPASS_SCHOOL_NAME:Your School Name}
schoolpass.school.principal=${SCHOOLPASS_SCHOOL_PRINCIPAL:Principal Name}
schoolpass.school.year=${SCHOOLPASS_ACADEMIC_YEAR:2026}
schoolpass.upload-dir=${SCHOOLPASS_UPLOAD_DIR:./data/uploads}
