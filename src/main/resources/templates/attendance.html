<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance • SchoolPass</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><section class="page-head"><div><div class="eyebrow">ARRIVAL RECORDS</div><h1>Attendance</h1><p>Arrival only. One recorded arrival per student per day.</p></div><a class="primary" th:href="@{/scan}">Scan arrival</a></section><form class="search"><input type="date" name="date" th:value="${date}"><button class="secondary">View date</button></form><div class="panel table-wrap"><table><thead><tr><th>Time</th><th>Student</th><th>Code</th><th>Device</th></tr></thead><tbody><tr th:each="r:${records}"><td th:text="${#temporals.format(r.arrivalTime,'HH:mm:ss')}">08:00</td><td th:text="${r.studentName}">Student</td><td th:text="${r.studentCode}">CODE</td><td th:text="${r.scannerDevice}">Browser</td></tr></tbody></table><div th:if="${#lists.isEmpty(records)}" class="empty big">No arrivals recorded for this date.</div></div></main></body></html>
