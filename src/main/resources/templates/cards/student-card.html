<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student card • SchoolPass</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="card-page"><div class="print-actions"><button class="secondary" onclick="window.print()">Print card</button><a class="secondary" th:href="@{/students}">Back</a></div><article class="student-card"><div class="card-top"><div class="brand-mark">SP</div><div><div class="card-school" th:text="${student.schoolName}">SCHOOL NAME</div><div class="card-title">STUDENT IDENTIFICATION CARD</div></div></div><div class="card-body"><div class="card-photo"><img th:if="${student.photoUrl!=null&&!student.photoUrl.isBlank()}" th:src="${student.photoUrl}" alt="Student photo"><div th:unless="${student.photoUrl!=null&&!student.photoUrl.isBlank()}" class="photo-placeholder">PHOTO</div></div><div class="card-info"><h1 th:text="${student.firstName+' '+student.lastName}">Student Name</h1><div class="card-row"><span>Student code</span><b th:text="${student.studentCode}">CODE</b></div><div class="card-row"><span>Class / stream</span><b th:text="${student.className+' '+(student.section==null?'':student.section)}">S4 MCB</b></div><div class="card-row"><span>Academic year</span><b th:text="${student.academicYear}">2026</b></div><div class="card-row"><span>Principal</span><b th:text="${student.principalName}">Principal</b></div></div><div class="qr-box"><img th:src="@{/students/{id}/qr(id=${student.id})}" alt="Secure QR"><small>Scan for school arrival verification</small></div></div><div class="card-footer"><span>School property • If found, return to the school office.</span><b>SECURE CREDENTIAL</b></div></article></body></html>
