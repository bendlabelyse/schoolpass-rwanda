<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance • SchoolPass</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><div th:replace="~{fragments/nav :: nav}"></div><main class="container"><section class="page-head"><div><div class="eyebrow">AUTHORIZED FINANCE</div><h1>Fees & uniform payments</h1><p>This area is restricted to finance and administrator roles.</p></div></section><form class="search" method="get"><input name="q" th:value="${query}" placeholder="Search student…"><button class="secondary">Search</button></form><div class="panel table-wrap"><table><thead><tr><th>Student</th><th>Required (RWF)</th><th>Paid (RWF)</th><th>Status</th><th>Uniform</th><th>Update</th></tr></thead><tbody><tr th:each="s:${students}"><td><b th:text="${s.firstName+' '+s.lastName}">Name</b><span th:text="${s.studentCode}">CODE</span></td><td th:text="${s.feeRequired}">0</td><td th:text="${s.feePaid}">0</td><td><span class="pill" th:classappend="${s.feeStatus=='UNPAID'?' red':s.feeStatus=='PARTIALLY PAID'?' amber':' green'}" th:text="${s.feeStatus}">UNPAID</span></td><td th:text="${s.uniformStatus}">UNPAID</td><td><details><summary class="icon-btn">Edit</summary><form class="mini-form" th:action="@{/finance/update/{id}(id=${s.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="required" type="number" min="0" th:value="${s.feeRequired}" required><input name="paid" type="number" min="0" th:value="${s.feePaid}" required><select name="uniformStatus"><option value="PAID" th:selected="${s.uniformStatus=='PAID'}">Paid</option><option value="PARTIAL" th:selected="${s.uniformStatus=='PARTIAL'}">Partial</option><option value="UNPAID" th:selected="${s.uniformStatus=='UNPAID'}">Not paid</option></select><button class="primary small">Save</button></form></details></td></tr></tbody></table><div th:if="${#lists.isEmpty(students)}" class="empty big">No student records yet.</div></div></main></body></html>
